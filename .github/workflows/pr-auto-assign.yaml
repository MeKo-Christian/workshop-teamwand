name: auto-author-assign

# Assigns every pull request to its author, so "assigned to me" in GitHub and
# `gh pr list --assignee @me` show your own pull requests.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Author Assign
        uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a # v3.1.0
